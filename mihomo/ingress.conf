# Serve the metacubexd panel on the ingress port and reverse-proxy the mihomo
# external-controller API to the local controller, so the panel's assets and API
# calls stay same-origin behind HA ingress.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8099 default_server;

    # host_network add-on: the ingress request arrives from the hassio bridge
    # gateway, so restrict access to that network and reject everything else.
    allow 172.30.32.0/23;
    deny all;

    error_log /dev/stderr warn;
    access_log off;

    root /opt/metacubexd;
    index index.html;

    # mihomo external-controller RESTful API + websockets (traffic/logs/memory
    # /connections streams). These fixed top-level paths never collide with the
    # hash-router SPA's static assets.
    location ~ ^/(logs|traffic|memory|version|configs|proxies|group|rules|connections|providers|cache|dns|storage|restart|upgrade|debug)(/|$) {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # metacubexd is a hash-router SPA: any other path is a static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
